# @package _global_
# Relaxed Recursive Transformer: Average init + truncated-SVD LoRA r=512 (RRT 2410.20672 Fig. 6 setting).
# Everything else reproduces the FastWAM LIBERO release recipe (train_zero1.sh 8 x batch 2 = global 16,
# 10 epochs, lr 1e-4 cosine, wd 1e-2, action/video shift 5.0 as in the released checkpoint), run on 16 GPUs x batch 1.

defaults:
  - override /data: libero_2cam
  - override /model: fastwam
  - _self_

batch_size: 1
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  tokenizer_model_id: Wan-AI/Wan2.2-TI2V-5B
  redirect_common_files: false
  action_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
  rrt:
    num_loops: 2
    init: average
    lora_rank: 512

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
keep_last_checkpoints: 1
eval_every: 200

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
